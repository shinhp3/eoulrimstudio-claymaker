<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>도자기 석고몰드 주문제작</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/order.css">
</head>
<body class="order-landing">
<main class="landing">
  <header class="landing__header">
    <h1 class="landing__title">도자기 석고몰드 주문제작</h1>
    <p class="landing__subtitle">원하는 형태를 제작 의뢰하거나, 예상 견적을 먼저 확인해보세요.</p>
  </header>

  <div class="landing__cards">
    <article class="choice-card choice-card--primary">
      <div class="choice-card__body">
        <h2 class="choice-card__title">바로 주문 제작 의뢰하기</h2>
        <p class="choice-card__desc">사진, 스케치, 도면을 업로드하고 제작 가능 여부 및 견적 상담을 받아보세요.</p>
      </div>
      <a href="order.html" class="btn btn-primary choice-card__btn">주문 의뢰 시작하기</a>
    </article>

    <article class="choice-card">
      <div class="choice-card__body">
        <h2 class="choice-card__title">예상 견적 먼저 확인하기</h2>
        <p class="choice-card__desc">간단한 형태를 직접 모델링하고 예상 견적을 확인할 수 있습니다.</p>
      </div>
      <a href="studio.html" class="btn choice-card__btn">3D 견적 확인하기</a>
    </article>
  </div>
</main>
</body>
</html>
