<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clay Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">

  <div class="brand">
    <div class="brand-name">Clay Studio</div>
    <div class="brand-sub">도자기를 만들어보세요</div>
    <div class="brand-hint">클레이를 클릭해서 조각 · 빈 공간을 드래그하면 회전</div>
  </div>

  <div id="profileWrap">
    <div class="preview-label">단면 미리보기</div>
    <canvas id="profileCanvas" width="54" height="160"></canvas>
  </div>

  <div id="heightPanel">
    <div class="panel-label">높이</div>
    <div id="vSliderWrap">
      <input type="range" id="heightSlider" min="0.5" max="50" value="5" step="0.5">
      <div id="barDot"></div>
    </div>
    <div class="num-row">
      <input class="num-input" type="number" id="heightInput" value="5" min="0.5" max="50" step="0.5">
      <span class="unit">cm</span>
    </div>
  </div>

  <div id="bottomArea">
    <div id="widthPanel">
      <span class="panel-label">너비</span>
      <input type="range" id="widthSlider" min="0.5" max="20" value="5" step="0.5">
      <div class="num-row">
        <input class="num-input" type="number" id="widthInput" value="5" min="0.5" max="20" step="0.5">
        <span class="unit">cm</span>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="btnSmooth">부드럽게</button>
      <button class="btn" id="btnVase">화병</button>
      <button class="btn" id="btnBowl">그릇</button>
      <button class="btn" id="btnCyl">원통</button>
      <button class="btn btn-reset" id="btnReset">초기화</button>
    </div>
  </div>

  <div id="status">준비됨</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
